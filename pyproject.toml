[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rine"
version = "0.14.0"
description = "Python SDK for the Rine messaging platform — E2E-encrypted messaging for AI agents"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.11"
authors = [{ name = "Rine Network" }]
keywords = ["rine", "messaging", "agents", "e2ee", "encryption", "ai-agents", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "cryptography>=43.0",
    "pydantic>=2.0",
    # rine's post-quantum core. A hard dependency rather than an extra, for two
    # reasons: groups are MLS by default, so without it an agent cannot create,
    # join, read or send in a group at all; and 1:1 messages are post-quantum by
    # default, so the wheel's ML-KEM-768 primitives are on the DM path too.
    # Prebuilt wheels cover linux x64/arm64 (glibc+musl) and macOS arm64/x64;
    # Windows is not published yet.
    # Version floor: 0.2.0 is the first rine-mls with the org-root surface this
    # SDK is built on: the ML-KEM-768 and ML-DSA-65 seed-derived keys, the
    # `AllowedIdentities` set an MLS client opens with (credential identities are
    # the ASCII of the canonical agent id), the `EpochReader` that opens an
    # escrowed epoch, and `take_escrow_exports`. It also drops the classical
    # cipher suite, so a 0.1.x wheel cannot be paired with this SDK at all.
    # Upper bound: this SDK and the Node stack (@rine-network/mls, pinned `^0.2.0`
    # by rewrite-file-deps.py at publish time) share the same on-disk group-state
    # encoding, since our docs bless a shared config dir between a Python and a
    # Node agent. The two runtimes must agree on that encoding byte-for-byte, so
    # the bound is a correctness constraint, not version caution: an unbounded
    # floor would let Python silently pick up a 0.3.0 that changed the wire
    # encoding while Node's `^0.2.0` refuses it, breaking the shared state with
    # no error on either side.
    "rine-mls>=0.2.0,<0.3.0",
    # The BIP39 English wordlist, for verification words. A hard dependency
    # rather than an extra because recomputing an agent's words locally is the
    # only thing that makes them mean anything — a surface that falls back to
    # printing the string the server asserted is comparing the server against
    # itself. Pure Python, no dependencies of its own, and the *same* package
    # the rine server derives its words with, so all three implementations read
    # one wordlist rather than three copies that can drift apart.
    "mnemonic>=0.21",
]

[project.urls]
Homepage = "https://rine.network"
Documentation = "https://docs.rine.network"
Repository = "https://codeberg.org/rine/rine-python-sdk"
Issues = "https://codeberg.org/rine/rine-python-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
    # x402 signing — the test suite exercises the payer/wallet path, so the dev
    # environment always carries the (otherwise optional) payments extra.
    "eth-account>=0.13.0,<0.14",
]
payments = [
    "eth-account>=0.13.0,<0.14",
]

[tool.uv.sources]
# Development only — never part of the published metadata: until `rine-mls` is
# on PyPI, resolve it from the crate in this repo so the SDK is testable against
# the core it actually ships with. Drop this once the wheel is published.
rine-mls = { path = "../rine-mls/crates/rine-mls-py" }

[tool.hatch.build.targets.sdist]
# .gitignore does NOT govern sdist contents — this list does. `uv.lock` is excluded for
# the reason the [tool.uv.sources] block above states: this lock resolves `rine-mls` from
# `../rine-mls/crates/rine-mls-py`, a directory that exists only inside this monorepo, so
# `uv sync` from an unpacked sdist fails to resolve it. The sdist's own METADATA carries
# the real dependency floors; a lock is only ever as fresh as its last re-lock.
# `.gitignore` is NOT excludable from here — hatchling force-includes it whatever this list
# says. What keeps the parent directory's out of the sdist is `rine-sdk/.gitignore` existing
# at all; see the note at the top of that file before deleting it.
exclude = ["phases/", "e2e/", "e2e_smoke.py", ".e2e.env", "*.env", ".uv-cache/", ".venv/", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/rine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# 🔴 A hang has to end the run, not stall it. Several sender-key regions sit
# behind non-reentrant locks (`rine._crypto.sender_keys_thread_lock`): the
# blocking tier now refuses a same-thread re-entry outright, but a coroutine
# re-entering the asyncio tier still waits forever, and without this a
# regression there would hang the suite — and any publish train that runs it —
# instead of failing it. stdlib faulthandler rather than a plugin, so the gate
# needs no dependency the publish train has to carry. The budget is PER TEST,
# and 120 s is more than twice what all ~1800 of them take together, so it can
# only fire on a real stall.
# `faulthandler_exit_on_timeout` needs pytest >= 8.4; on an older one the
# traceback is still dumped, the run just does not abort.
faulthandler_timeout = 120
faulthandler_exit_on_timeout = true

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "TCH",
    "D100", "D101", "D102", "D103", "D107", "D205", "D400",
]
ignore = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["rine"]
mypy_path = "src"
